version: '3.8'

services:
  mongodb:
    container_name: exam-system-mongodb
    image: mongo:7
    restart: unless-stopped
    ports:
      - "28017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: exam_system
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - exam-network

  redis:
    container_name: exam-system-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6403:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam-network

  backend:
    container_name: exam-system-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/exam_system?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: exam-system-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: http://localhost:8003
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - exam-network

  frontend:
    container_name: exam-system-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8003:80"
    depends_on:
      - backend
    networks:
      - exam-network

volumes:
  mongodb_data:
    name: exam-system-mongodb-data
  redis_data:
    name: exam-system-redis-data
  backend_uploads:
    name: exam-system-backend-uploads

networks:
  exam-network:
    name: exam-system-network
    driver: bridge
